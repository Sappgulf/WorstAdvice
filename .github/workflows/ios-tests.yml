name: iOS Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: xcodebuild-tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve simulator destination
        run: |
          set -euo pipefail

          DESTINATION_ID=$(
            xcodebuild -showdestinations \
              -project "Badvice.xcodeproj" \
              -scheme "Badvice" \
            | tr -d '\r' \
            | awk '
              /platform:[[:space:]]*iOS Simulator/ && /id:/ && $0 !~ /placeholder/ {
                line = $0
                sub(/^.*id:[[:space:]]*/, "", line)
                sub(/[,}].*$/, "", line)
                print line
                exit
              }
            '
          )

          if [ -z "${DESTINATION_ID:-}" ]; then
            DESTINATION_ID=$(
              xcrun simctl list devices available \
              | awk -F '[()]' '/Booted/ && /iPhone/ { print $2; exit }'
            )
          fi

          if [ -z "${DESTINATION_ID:-}" ]; then
            DESTINATION_ID=$(
              xcrun simctl list devices available \
              | awk -F '[()]' '/iPhone/ { print $2 }' \
              | tail -n 1
            )
          fi

          if [ -z "${DESTINATION_ID:-}" ]; then
            echo "No iOS Simulator destination could be resolved."
            echo "xcodebuild -showdestinations output:"
            xcodebuild -showdestinations -project "Badvice.xcodeproj" -scheme "Badvice" || true
            echo "xcrun simctl list devices available output:"
            xcrun simctl list devices available || true
            exit 1
          fi

          echo "Using simulator id: $DESTINATION_ID"
          echo "TEST_DESTINATION=platform=iOS Simulator,id=$DESTINATION_ID" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "Badvice.xcodeproj" \
            -scheme "Badvice" \
            -destination "$TEST_DESTINATION" \
            -resultBundlePath "TestResults.xcresult"

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
