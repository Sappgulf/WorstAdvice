name: iOS Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: xcodebuild-tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          set -euo pipefail
          chmod +x scripts/ci_xcodebuild_tests.sh
          bash scripts/ci_xcodebuild_tests.sh

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: .build/TestResults.xcresult
          if-no-files-found: ignore
