name: iOS Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: xcodebuild-tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run canonical iOS test script
        env:
          PROJECT_PATH: Badvice.xcodeproj
          SCHEME_NAME: WorstAdvice
          IOS_DESTINATION: platform=iOS Simulator,name=iPhone 15,OS=latest
        run: |
          set -euo pipefail
          bash scripts/ci_xcodebuild_tests.sh

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-raw-log
          path: xcodebuild-test.log
          if-no-files-found: ignore
