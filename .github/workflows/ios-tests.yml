name: iOS Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: xcodebuild-tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve simulator destination
        run: |
          set -euo pipefail

          DESTINATION_ID=$(
            xcodebuild -showdestinations \
              -project "WorstAdvice.xcodeproj" \
              -scheme "WorstAdvice" \
            | tr -d '\r' \
            | awk '
              /platform:iOS Simulator/ && /id:/ && $0 !~ /placeholder/ {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^id:/) {
                    gsub(/^id:/, "", $i)
                    gsub(/,/, "", $i)
                    print $i
                    exit
                  }
                }
              }
            '
          )

          if [ -z "${DESTINATION_ID:-}" ]; then
            echo "No iOS Simulator destination could be resolved."
            exit 1
          fi

          echo "Using simulator id: $DESTINATION_ID"
          echo "TEST_DESTINATION=platform=iOS Simulator,id=$DESTINATION_ID" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "WorstAdvice.xcodeproj" \
            -scheme "WorstAdvice" \
            -destination "$TEST_DESTINATION" \
            -resultBundlePath "TestResults.xcresult"

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
